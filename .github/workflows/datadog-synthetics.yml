# Datadog Synthetic tests are intentionally disabled for this project.
# The previous workflow required DD_API_KEY and DD_APP_KEY repository secrets
# and caused GitHub Actions to fail when those optional credentials were absent.
# Re-enable this workflow only when Datadog monitoring is configured.

name: Datadog Synthetic Tests (Disabled)

on:
  workflow_dispatch:

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Datadog tests disabled
        run: echo "Datadog Synthetic tests are disabled. No Datadog credentials are required."
